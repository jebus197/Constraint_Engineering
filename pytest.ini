[pytest]
# Global per-test timeout backstop (2026-06-09). Before this, a test with no
# timeout could block the whole suite for hours (e.g. an immune-pipeline /
# ouroboros test waiting on a sandbox subprocess or a real arxiv / semantic_scholar
# call).
#
# 300s is a backstop, and it has tripped in practice — on
# test_exp29_integration.py::test_three_round_flow, and not on a hang. That test
# made ~44 serialised 15 s live claude-CLI dispatches under _CLAUDE_CLI_LOCK: the
# designed behaviour of an undeclared network dependency, not a deadlock.
# (Corrected 2026-07-31; the earlier note here claimed the timeout "only ever trips
# on a genuine hang" and reasoned from a "full non-network suite" that did not exist.)
#
# Since the suite was made offline by default on 2026-07-31 the whole run completes
# in 109–276 s with outbound calls denied, so 300s is now genuinely a hang detector
# rather than a live-dispatch budget. Requires pytest-timeout.
timeout = 300
timeout_method = thread

# Register markers used across the suite (silences PytestUnknownMarkWarning).
#
# `network` is a LEGACY MARKER AND DOES NOT DEFINE THE OFFLINE SELECTION.
# Registered 2026-06-09 (c865bd9), first used 2026-04-17 (bdfc93a). Measured
# 2026-07-31: `-m network` selects 3 of 2102 tests, and none of the 62 tests found
# making outbound calls that day — despite the old wording here naming "model
# dispatch". `-m "not network"` has therefore never been an offline run, and every
# figure in the project record labelled "non-network" before 2026-07-31 was produced
# by a hand-curated file-exclusion list, not by this marker.
#
# What actually makes the suite offline is bench/tests/conftest.py: HF_HUB_OFFLINE,
# bench/live_dispatch_policy.py gating immune_agents._get_claude_cli(), and a
# socket/subprocess guard. Use `--netguard-strict` to fail on any outbound attempt,
# and CDSFL_ALLOW_LIVE_DISPATCH=1 to opt back in deliberately. See docs/REPRODUCING.md.
#
# The marker is retained only so that honestly-marked tests stay deselectable.
#
# Keep each marker on ONE line: pytest splits this ini list on newlines, so a
# wrapped description registers its continuation lines as separate bogus markers.
# The previous two-line `network` entry did exactly that: `pytest --markers` reported
# a second marker whose name was the whole continuation line, `dispatch); excluded from
# offline runs with -m "not network".` (reproduced 2026-07-31). Hence the comment block.
markers =
    network: LEGACY — does NOT define the offline selection; see the comment above and bench/tests/conftest.py. Marks a test known to want a real external call. Deselecting it with -m "not network" is NOT an offline run.
    allow_outbound: this test ATTEMPTS an outbound call deliberately — the denial is the experimental condition (e.g. proving a dead backend degrades to a fallback). The call is still blocked; the marker only exempts it from the --netguard-strict auto-fail.
