[pytest]
# Global per-test timeout backstop (2026-06-09). Before this, a test with no
# timeout could block the whole suite for hours (e.g. an immune-pipeline /
# ouroboros test waiting on a sandbox subprocess or a real arxiv / semantic_scholar
# call). 300s is generous — the full non-network suite's slowest legitimate test is
# well under it — so this only ever trips on a genuine hang, converting it into a
# fast, reported failure instead of an indefinite block. Requires pytest-timeout.
timeout = 300
timeout_method = thread

# Register markers used across the suite (silences PytestUnknownMarkWarning).
markers =
    network: test makes real external network calls (arxiv, semantic_scholar, model
        dispatch); excluded from offline runs with -m "not network".
