# CDSFL Registry — Layer 4: DeepSeek V3
# Model-specific tuning for DeepSeek.

[model]
name = "deepseek-v3"
alias = "deepseek"
timeout = 120

[protocol]
# DeepSeek can oscillate between rounds — detect and halt.
churn_detection_threshold = 0.15
explicit_format_instructions = true
structured_output_native = false
