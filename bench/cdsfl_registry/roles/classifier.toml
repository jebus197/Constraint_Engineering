# Layer 5 — ROLE, FUNCTIONAL AXIS. Added 2026-11-14 for task B142.
#
# ★ WHY THIS FILE MAY NOW EXIST, when a guard refused it until today.
# `bench/tests/test_the_role_layer_cannot_collide_2026-11-02.py` carried
# `test_the_functional_vocabulary_is_NOT_declared`, which asserted that
# worker.toml, classifier.toml and orchestrator.toml must NOT exist, because
# which declared member each of his functional names maps to is POLICY and
# B21 records it as owed by the founder. HE RULED ON 2026-11-12, verbatim:
# "Verdict. Yes do both. stm", against the item asking "whether the 4
# interface roles map onto the harness roles, and whether the credential
# store is built now or after the runway". The guard was OUTGROWN by his
# ruling rather than broken, and is re-pointed rather than deleted: it now
# asserts the post-ruling state and still refuses any policy key.
#
# ★ THE 4 NAMES ARE THE UX BRIEF'S, NOT MINE. Section 10 of the authoritative
# design brief and the mockup html_sources/v6/08_settings.html both specify
# Orchestrator, Worker, Researcher and Classifier. The role selector could
# not be populated as designed because known_roles() returned only the 3
# structural names.
#
# ★ THE AXIS IS LOAD-BEARING. The panel round of 2026-10-31 measured that the
# structural and functional vocabularies are 2 DISTINCT DIMENSIONS and that
# reconciliation is lossy in both directions. The existing 3 declare
# axis = "structural"; these 4 declare axis = "functional". Nothing merges
# across the 2.
#
# ★ NO POLICY KEY IS SET, and that is still the rule. The layer's MECHANISM
# is mine; a role's CONTENT -- what a classifier actually constrains -- is
# his and is not invented here. The collision guard enforces
# keys <= {"name", "axis"}, so the FUNCTIONAL-TO-STRUCTURAL MAP cannot live
# in this file and lives at bench/model_catalogue.py instead, where his
# ruling is cited at the declaration.
#
# NO STRUCTURAL COUNTERPART, and that is a measurement rather than an omission. The 2026-10-31 panel found classifier names no seat position in the enum; it may be a function applied to content that any seat performs. Forcing it onto participant would invent the policy this layer exists not to invent.

[role]
name = "classifier"
axis = "functional"
