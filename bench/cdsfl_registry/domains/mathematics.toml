# CDSFL Registry — Layer 2: Mathematics Domain
# Applied when task domain is "mathematics".

[verification]
sympy_verification = "mandatory"    # all symbolic claims must pass SymPy
proof_structure_check = true        # verify logical structure of proofs
numerical_tolerance = 1e-10         # floating-point comparison tolerance

[constraints]
dimensional_analysis = true         # check dimensional consistency
assume_real_unless_stated = true    # default to real-valued solutions

# Immune pipeline parameterisation lives in domains/immune/mathematics.toml
