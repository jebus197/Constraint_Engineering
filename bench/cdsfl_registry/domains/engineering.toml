# CDSFL Registry — Layer 2: Engineering Domain
# Applied when task domain is "engineering" or "structural" or "hardware"
# or "industrial" or "product-engineering".

[verification]
unit_consistency_check = true       # all quantities must have consistent units
physical_bounds_check = true        # results must be physically plausible
safety_factor_required = true       # engineering claims must address safety margins

[constraints]
standards_reference = true          # cite applicable standards where relevant
material_property_verification = true
