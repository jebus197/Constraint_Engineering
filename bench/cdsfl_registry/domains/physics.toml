# CDSFL Registry — Layer 2: Physics Domain
# Applied when task domain is "physics" or "chemistry".

[verification]
sympy_verification = "mandatory"        # symbolic verification for physics equations
unit_consistency_check = true           # dimensional analysis is non-negotiable
conservation_law_check = true           # verify energy/momentum/charge conservation

[constraints]
physical_bounds_check = true            # results must not violate physical limits
significant_figures_tracking = true     # track precision through calculations
