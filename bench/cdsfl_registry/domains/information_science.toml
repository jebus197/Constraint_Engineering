# CDSFL Registry — Layer 2: Information Science Domain
# Applied when task domain is "information_science".

[verification]
hypothesis_test_required = true             # statistical claims must include hypothesis test
effect_size_required = true                 # must report effect size for retrieval/classification claims
distribution_check = true                   # verify distributional assumptions
cross_domain_interface_check = true         # verify assumptions at domain boundaries (multi-source evidence)
assumption_propagation_audit = true         # track assumption propagation across datasets and methods

[constraints]
sample_size_stated = true                   # must state N for all empirical claims
alpha_level_stated = true                   # must state significance threshold

# Immune pipeline parameterisation lives in domains/immune/information_science.toml
