# ----------------------------------------------------------------------------
# SUBDOMAIN ALIASES -- an old spelling that names a SUBDOMAIN, not a domain.
# ----------------------------------------------------------------------------
# `hardware`, `industrial`, `product-engineering` and `structural` were encoding
# DIRECTORIES with no config, and 4 of the 7 names that existed on only one side
# of the 2 vocabularies. Making them domain aliases was the defect the founder
# caught: engineering's default was owed, so a structural task walked the
# subdomain list and loaded `hardware_embedded`. Making them nothing at all left
# them bypassing the manifest entirely and falling through to the alphabetical
# rule -- safe, but not unified.
#
# They are SUBDOMAIN aliases: a spelling that resolves to a (domain, subdomain)
# PAIR. That is what unifies the vocabulary without either defect.
[subdomain_aliases]
structural = ["engineering", "structural"]
hardware = ["engineering", "electronics"]
industrial = ["engineering", "manufacturing"]
"product-engineering" = ["engineering", "product"]
product_engineering = ["engineering", "product"]
biomedical = ["biology", "biomedical"]
