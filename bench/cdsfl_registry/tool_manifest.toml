# ── Code analysis tools (file-based) ─────────────────────────────────────

[tools.type_checker]
description = "mypy --strict subset for signature / type consistency."
verifier = "_verify_type_check"
needs_file = true
claim_types = ["code_structural"]
domain_hints = ["cs_software"]
cost_class = "slow"
install_check = "import mypy"
package_hint = "mypy>=1.19"

[tools.lint_check]
description = "ruff linting for code quality issues."
verifier = "_verify_lint_check"
needs_file = true
claim_types = ["code_structural", "code_behavioral"]
domain_hints = ["cs_software"]
cost_class = "fast"
install_check = "import ruff"
package_hint = "ruff>=0.15"

[tools.security_scan]
description = "bandit static security scan."
verifier = "_verify_security_scan"
needs_file = true
claim_types = ["code_behavioral"]
domain_hints = ["cs_software", "security"]
cost_class = "medium"
install_check = "import bandit"
package_hint = "bandit>=1.8"

[tools.bytecode_analysis]
description = "dis-module bytecode inspection for dead code after RETURN_VALUE."
verifier = "_verify_bytecode_analysis"
needs_file = true
claim_types = ["logical", "code_behavioral"]
domain_hints = ["cs_software"]
cost_class = "fast"
install_check = "import dis"
package_hint = "stdlib"

[tools.symbolic_execution]
description = "crosshair z3-backed symbolic execution of Python contracts."
verifier = "_verify_symbolic_execution"
needs_file = true
claim_types = ["code_behavioral"]
domain_hints = ["cs_software"]
cost_class = "slow"
install_check = "import crosshair"
package_hint = "crosshair-tool>=0.0.102"

# ── Delegated tools (handled by other cells) ─────────────────────────────

[tools.ast_analysis]
description = "Structural AST walk. Delegated to B-Cell v2, not run here."
delegate = "b_cell_v2"
claim_types = ["code_structural", "code_behavioral"]
domain_hints = ["cs_software"]

[tools.test_runner]
description = "pytest runner. Delegated to CT cell, not run here."
delegate = "ct_cell"
claim_types = ["code_behavioral"]
domain_hints = ["cs_software"]
