needs_file = false
claim_types = ["mathematical"]
domain_hints = ["operations_research", "engineering", "economics"]
cost_class = "medium"
install_check = "import pulp"
package_hint = "pulp>=3.3"

[tools.astronomical]
description = "Astronomical constants and unit conversion (astropy)."
verifier = "_verify_astronomical"
needs_file = false
claim_types = ["mathematical"]
domain_hints = ["astronomy", "physics"]
