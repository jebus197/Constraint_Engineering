# B-Cell Specialist Tool Manifest
#
# Single source of truth for all verification tools available to
# `_specialist_b_cell_dispatch()` in `bench/immune_agents.py`.
#
# Each `[tools.<name>]` table describes one tool. The dispatch walks the
# per-domain tool list (from the immune TOMLs under
# `bench/cdsfl_registry/domains/immune/*.toml`), looks up each name in this
# manifest, and calls the named verifier function. Entries that set
# `delegate = "<cell>"` are skipped by this dispatch because another cell
# handles them (e.g. the structural AST walker in B-Cell v2, or pytest in
# the CT cell).
#
# Fields:
#   description     : Human-readable summary of what the tool verifies.
#   verifier        : Function name in bench/immune_agents.py. Omit for
#                     delegated tools.
#   needs_file      : If true, verifier signature is (claim, file_path);
#                     otherwise (claim,).
#   claim_types     : ClaimType values this tool can decide (mathematical,
#                     logical, statistical, code_structural, code_behavioral).
#   domain_hints    : Free-text domain tags — used by the future UX
#                     "app store" to group tools by discipline.
#   cost_class      : "fast" (< 2 s typical), "medium" (2–10 s), "slow" (> 10 s).
#                     Subjective wall-clock estimate on reference hardware.
#   install_check   : Python expression that returns truthy when the tool is
#                     installed. Evaluated in the tools-Python interpreter.
#   package_hint    : PEP 508 style hint for future auto-install suggestions.
#   independence_class : WHICH ROUTE the tool takes to the answer. Added
#                     2026-10-31 for the primary/secondary falsifier rule.
#                     Two tools in the SAME class are NOT independent
#                     falsifiers of each other, because they share the
#                     formulation, and the formulation is where the errors
#                     live. The vocabulary, 6 values:
#                       symbolic  - manipulates the expression algebraically
#                       numeric   - evaluates the author's expression numerically
#                       search    - searches for a counterexample / proves unsat
#                       artefact  - statically analyses the REAL artefact
#                       execute   - RUNS the real artefact and observes
#                       reference - reads an independent curated source
#                                   (a unit registry, a constants table, a
#                                   chemistry or sequence model) rather than
#                                   recomputing from the claim
#                       model     - an LLM reasons about it. NEVER selected as
#                                   a secondary without the founder's
#                                   authorisation, because the route is PAID.
#                     THE CLASS IS A PROXY AND IT IS DELIBERATELY
#                     CONSERVATIVE. It will sometimes refuse a pair that is
#                     in fact independent (networkx against z3 on a graph
#                     claim is the clearest case, both being "search"). It
#                     errs toward reporting PRIMARY ONLY rather than toward
#                     claiming corroboration the pair has not earned, which
#                     is the safe direction for a falsification harness.
#   delegate        : If set, this tool is handled by a different cell. Value
#                     is a short label of the owning cell.
#   secondary_only  : If true, this tool is NEVER chosen as the PRIMARY
#                     falsifier -- only as a secondary, by
#                     `bench/falsifier_pairing.select_secondary`. Added
#                     2026-10-31 to implement the founder's ruling of
#                     2026-09-28 verbatim: Wolfram "should never be considered
#                     the primary falsifier route". Without this field,
#                     appending Wolfram to a claim type would have made it
#                     reachable as position 13 of the `mathematical` dispatch
#                     order -- a primary route whenever the 12 before it
#                     returned UNCERTAIN, which is exactly what the ruling
#                     forbids.
#
# Adding a new tool:
#   1. Write _verify_<name>(claim[, file_path]) in bench/immune_agents.py,
#      following the existing CellVerdict pattern.
#   2. Append a [tools.<name>] block below.
#   3. Reference the name from the appropriate domains/immune/*.toml file.
#   No changes to the dispatch code are required.

# ── STEM / mathematical tools ────────────────────────────────────────────

[tools.sympy]
description = "Symbolic mathematics: algebraic identities, limits, equation solving."
verifier = "_verify_sympy"
needs_file = false
claim_types = ["mathematical", "logical"]
independence_class = "symbolic"
domain_hints = ["mathematics", "physics", "chemistry", "engineering"]
cost_class = "fast"
install_check = "import sympy"
package_hint = "sympy>=1.14"

[tools.z3]
description = "SMT constraint satisfaction and formal verification."
verifier = "_verify_z3"
needs_file = false
claim_types = ["logical", "mathematical"]
independence_class = "search"
domain_hints = ["mathematics", "cs_software", "engineering"]
cost_class = "medium"
install_check = "import z3"
package_hint = "z3-solver>=4.16"

[tools.statsmodels]
description = "Regression, ADF, ARIMA, t-tests, hypothesis testing."
verifier = "_verify_statistical"
needs_file = false
claim_types = ["statistical"]
independence_class = "numeric"
domain_hints = ["statistics", "biology", "social_science"]
cost_class = "medium"
install_check = "import statsmodels"
package_hint = "statsmodels>=0.14"

# scipy shares the same verifier because _verify_statistical already routes
# to scipy.stats for point tests. Listed separately so domain TOMLs can
# name either preference without duplicating the elif branch.
[tools.scipy]
description = "scipy.stats tests, optimisation, integration (shared with statsmodels)."
verifier = "_verify_statistical"
needs_file = false
claim_types = ["statistical"]
independence_class = "numeric"
domain_hints = ["statistics", "physics", "engineering"]
cost_class = "medium"
install_check = "import scipy"
package_hint = "scipy>=1.13"

