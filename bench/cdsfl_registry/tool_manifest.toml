needs_file = false
claim_types = ["statistical", "mathematical"]
domain_hints = ["physics", "engineering", "statistics"]
cost_class = "fast"
install_check = "import uncertainties"
package_hint = "uncertainties>=3.2"

[tools.stoichiometric_balance]
