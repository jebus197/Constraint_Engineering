# ── Code analysis tools (file-based) ─────────────────────────────────────

[tools.type_checker]
description = "mypy --strict subset for signature / type consistency."
verifier = "_verify_type_check"
needs_file = true
claim_types = ["code_structural"]
independence_class = "artefact"
domain_hints = ["cs_software"]
cost_class = "slow"
install_check = "import mypy"
package_hint = "mypy>=1.19"

[tools.lint_check]
description = "ruff linting for code quality issues."
verifier = "_verify_lint_check"
needs_file = true
claim_types = ["code_structural", "code_behavioral"]
independence_class = "artefact"
domain_hints = ["cs_software"]
cost_class = "fast"
install_check = "import ruff"
package_hint = "ruff>=0.15"

[tools.security_scan]
description = "bandit static security scan."
verifier = "_verify_security_scan"
needs_file = true
claim_types = ["code_behavioral"]
independence_class = "artefact"
domain_hints = ["cs_software", "security"]
cost_class = "medium"
install_check = "import bandit"
package_hint = "bandit>=1.8"

[tools.bytecode_analysis]
description = "dis-module bytecode inspection for dead code after RETURN_VALUE."
verifier = "_verify_bytecode_analysis"
needs_file = true
claim_types = ["logical", "code_behavioral"]
independence_class = "artefact"
domain_hints = ["cs_software"]
cost_class = "fast"
install_check = "import dis"
package_hint = "stdlib"

[tools.symbolic_execution]
description = "crosshair z3-backed symbolic execution of Python contracts."
verifier = "_verify_symbolic_execution"
needs_file = true
claim_types = ["code_behavioral"]
independence_class = "search"
domain_hints = ["cs_software"]
cost_class = "slow"
install_check = "import crosshair"
package_hint = "crosshair-tool>=0.0.102"

# ── Model-backed specialists (network, cost-bounded) ────────────────────

[tools.deepseek_formal]
description = "DeepSeek R1 reasoner as formal-verification specialist — LLM fallback for claims mechanical verifiers cannot decide."
verifier = "_verify_deepseek_formal"
needs_file = false
claim_types = ["logical", "mathematical"]
independence_class = "model"
domain_hints = ["mathematics", "information_science", "cs_software"]
cost_class = "slow"
install_check = "import openai"
package_hint = "openai>=1.0"

# ── Delegated tools (handled by other cells) ─────────────────────────────

[tools.ast_analysis]
description = "Structural AST walk. Delegated to B-Cell v2, not run here."
delegate = "b_cell_v2"
claim_types = ["code_structural", "code_behavioral"]
independence_class = "artefact"
domain_hints = ["cs_software"]

[tools.test_runner]
description = "pytest runner. Delegated to CT cell, not run here."
delegate = "ct_cell"
claim_types = ["code_behavioral"]
independence_class = "execute"
domain_hints = ["cs_software"]

# ── Secondary-only falsifiers ────────────────────────────────────────────
#
# A tool here is a SECOND opinion and never a first. See `secondary_only`
# above for why the field exists and what it prevents.

[tools.wolfram]
description = "Wolfram Language on the local Engine, through the serial gate. SECONDARY falsifier only, per the founder's ruling of 2026-09-28."
verifier = "_verify_wolfram"
needs_file = false
claim_types = ["mathematical", "logical", "statistical"]
independence_class = "reference"
secondary_only = true
domain_hints = ["mathematics", "physics", "statistics", "engineering"]
cost_class = "slow"
install_check = "import shutil; assert shutil.which('wolframscript')"
package_hint = "Wolfram Engine (free) + wolframscript; NOT pip-installable, see resources/ONBOARDING.md"
